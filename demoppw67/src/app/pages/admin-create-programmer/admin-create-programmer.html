<div class="admin-create-container">

  <h2>Crear Programador</h2>

  <form (ngSubmit)="guardar()">

    <div class="form-group">
      <label>Cédula</label>
      <input 
        [(ngModel)]="programmer.persona.cedula" 
        name="cedula"
        required
        placeholder="Ingrese la cédula">
    </div>

    <div class="form-group">
      <label>Nombre</label>
      <input 
        [(ngModel)]="programmer.persona.nombre" 
        name="nombre" 
        required>
    </div>

    <div class="form-group">
      <label>Dirección</label>
      <input 
        [(ngModel)]="programmer.persona.direccion" 
        name="direccion">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input 
        type="email" 
        [(ngModel)]="programmer.email" 
        name="email" 
        required>
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input 
        type="password" 
        [(ngModel)]="programmer.password" 
        name="password" 
        required>
    </div>

    <!-- ✅ SELECT DE ESPECIALIDADES -->
    <div class="form-group">
      <label>Especialidad</label>

      <select 
        [(ngModel)]="programmer.especialidad.id"
        name="especialidad"
        required>

        <option value="" disabled>
          Seleccione una especialidad
        </option>

        <option 
          *ngFor="let e of especialidades" 
          [value]="e.id">
          {{ e.nombre }}
        </option>

      </select>
    </div>

    <div class="form-group">
      <label>Foto URL</label>
      <input 
        [(ngModel)]="programmer.photoUrl" 
        name="photo">
    </div>

    <div class="form-group">
      <label>Teléfono</label>
      <input 
        [(ngModel)]="programmer.phone" 
        name="phone">
    </div>

    <div class="form-group">
      <label>Redes sociales</label>
      <input 
        [(ngModel)]="programmer.socialLinks" 
        name="social">
    </div>

    <button class="btn-save" type="submit">
      Crear Programador
    </button>

  </form>

</div>
