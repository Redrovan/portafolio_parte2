<div class="portfolio-container">

  <app-back-button></app-back-button>

  <h2>Mi Portafolio de Proyectos</h2>

  <button class="btn-add" (click)="showForm = !showForm">
    ➕ Nuevo Proyecto
  </button>

  <!-- ================= FORMULARIO ================= -->

  <div class="project-form" *ngIf="showForm">

    <input placeholder="Nombre del proyecto"
      [(ngModel)]="newProject.name">

    <textarea placeholder="Descripción"
      [(ngModel)]="newProject.description"></textarea>

    <select [(ngModel)]="newProject.section">
  <option value="ACADEMICO">Académico</option>
  <option value="LABORAL">Laboral</option>
</select>

    <input placeholder="Tecnologías"
      [(ngModel)]="newProject.technologies">

    <input placeholder="Repositorio URL"
      [(ngModel)]="newProject.repositoryUrl">

    <input placeholder="Deploy URL"
      [(ngModel)]="newProject.deployUrl">

    <button class="btn-save" (click)="saveProject()">
      Guardar
    </button>

  </div>

  <!-- ================= ACADÉMICOS ================= -->

  <h3>📚 Proyectos Académicos</h3>

  <div class="projects-grid">

    <div class="project-card" *ngFor="let p of academic">

      <h4>{{ p.name }}</h4>
      <p>{{ p.description }}</p>

      <p class="tech">{{ p.technologies }}</p>

      <div class="links">
        <a [href]="p.repositoryUrl" target="_blank">Repositorio</a>
        <a [href]="p.deployUrl" target="_blank">Demo</a>
      </div>

      <button class="btn-delete" (click)="deleteProject(p.id)">
        Eliminar
      </button>

    </div>

  </div>

  <!-- ================= PROFESIONALES ================= -->

  <h3>💼 Proyectos Laborales</h3>

  <div class="projects-grid">

    <div class="project-card" *ngFor="let p of professional">

      <h4>{{ p.name }}</h4>
      <p>{{ p.description }}</p>

      <p class="tech">{{ p.technologies }}</p>

      <div class="links">
        <a [href]="p.repositoryUrl" target="_blank">Repositorio</a>
        <a [href]="p.deployUrl" target="_blank">Demo</a>
      </div>

      <button class="btn-delete" (click)="deleteProject(p.id)">
        Eliminar
      </button>

    </div>

  </div>

</div>
