<h2>Administración de Programadores</h2>

<!-- ======================= -->
<!-- SECCIÓN REPORTES -->
<!-- ======================= -->

<div style="margin-bottom: 20px; padding: 15px; border:1px solid #ddd; border-radius:8px;">

  <h3> Reportes Administrativos</h3>

  <p>Visualizar estadísticas de asesorías y proyectos</p>

  <button 
    class="btn-primary"
    routerLink="/admin/reports"
    style="padding:10px 16px; cursor:pointer;">
    Ver reportes
  </button>

</div>

<hr>

<!-- ======================= -->
<!-- TABLA PROGRAMADORES -->
<!-- ======================= -->

<table border="1" width="100%" cellpadding="8" cellspacing="0">

  <tr style="background:#f3f4f6;">
    <th>Nombre</th>
    <th>Email</th>
    <th>Especialidad</th>
    <th>Acciones</th>
  </tr>

  <tr *ngFor="let p of programmers">

    <td>{{ p.persona?.nombre }}</td>

    <td>{{ p.email }}</td>

    <td>{{ p.especialidad?.nombre }}</td>

    <td>
      <button 
        (click)="delete(p.id!)"
        style="background:#ef4444;color:white;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;">
        Eliminar
      </button>
    </td>

  </tr>

</table>
