<h2>Registrar Persona</h2>
<form (ngSubmit)="guardar()">
    <div>
        <label for="codigo">Cédula</label>
        <input type="text" id="codigo" name="codigo" required [(ngModel)]="persona.cedula"/>
    </div>
    <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required [(ngModel)]="persona.nombre"/>
    </div>
    <div>
        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion" required [(ngModel)]="persona.direccion"/>
    </div>
    <div>
        <button type="submit">Guardar</button>
        <button type="reset">Borrar</button>
    </div>


    
</form>
 {{mensaje}}
