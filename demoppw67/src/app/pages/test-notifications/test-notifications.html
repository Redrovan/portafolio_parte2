<h2>Probar Notificaciones FastAPI</h2>

<input placeholder="Teléfono" [(ngModel)]="phone"><br><br>

<input placeholder="Mensaje" [(ngModel)]="message"><br><br>

<input type="datetime-local" [(ngModel)]="time"><br><br>

<button (click)="send()">Crear Notificación</button>

<button (click)="process()">Procesar Envío</button>
