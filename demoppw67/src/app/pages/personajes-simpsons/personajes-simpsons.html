<h2>The simpsons</h2>


<table border="1">
    <thead>
        <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>Edad</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let personaje of personajes; let i = index;">
            <td><img src="https://cdn.thesimpsonsapi.com/500{{personaje.portrait_path}}"></td>
            <td>{{personaje.name}}</td>
            <td>{{personaje.age}}</td>
            <td>
                
            </td>
        </tr>
    </tbody>

</table>
