<div class="portfolio-edit-container" *ngIf="programmer">

<app-back-button></app-back-button>

  <h2>Mi Perfil</h2>

  <form (ngSubmit)="guardar()">

    <div class="form-group">
      <label>Nombre</label>
      <input [(ngModel)]="programmer.persona.nombre" name="nombre">
    </div>

    <div class="form-group">
      <label>Dirección</label>
      <input [(ngModel)]="programmer.persona.direccion" name="direccion">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input [(ngModel)]="programmer.email" name="email">
    </div>

    <div class="form-group">
      <label>Foto URL</label>
      <input [(ngModel)]="programmer.photoUrl" name="photo">
    </div>

    <div class="form-group">
      <label>Teléfono</label>
      <input [(ngModel)]="programmer.phone" name="phone">
    </div>

    <div class="form-group">
      <label>Redes sociales</label>
      <input [(ngModel)]="programmer.socialLinks" name="social">
    </div>

    <button class="btn-save" type="submit">
      Guardar Cambios
    </button>

  </form>

</div>
